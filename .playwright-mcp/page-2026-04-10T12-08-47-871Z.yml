  - table [ref=e50]:
    - rowgroup [ref=e51]:
      - row "【ご確認ください】 ■R-Loginの「利用者登録」は完了されていますか？ R-Loginの利用者（管理者/スタッフ）の登録が完了していない場合、RMSをご利用いただけません。 責任者様にR-Login利用規約に同意頂いた際、弊社より送らせていただきましたメール（※）に、【管理者/スタッフ登録用URL】を記載しています。 このURLから遷移したR-Login「利用者登録」画面にて、同メールに記載の認証コードを入力し、利用者（管理者/スタッフ）の登録を完了してください。 （※） subject ： 【楽●天】責任者様によるR-Login利用規約同意完了と認証コードの発行のご案内 ■R-Loginの「サービス別権限設定」は正しく設定されていますか？ R-Loginメニュー「利用者管理（権限管理）」の「サービス別権限設定」にて正しく設定がされていない場合、RMSをご利用いただけません。 ▼ 「サービス別権限設定」が正しく設定されている場合 以下のURLよりログインしてください。「お気に入り」や「ブックマーク」に登録することをお奨めします。 RMSログインURL https://mainmenu.rms.rakuten.co.jp/rms ▼ 「サービス別権限設定」が正しく設定されていない場合 R-Loginメニュー「利用者管理（権限管理）」の「サービス別権限設定」にて正しく設定された後に上記URLから再度ログインをお願いいたします。 ■以下の場合は、再度ログインし直していただく必要がございます ▼ブラウザを閉じてしまった場合 ▼ログイン後、長時間作業を行わなかった場合 ▼RMSにログインしていない状態で店舗運営マニュアル等を閲覧した場合 (店舗運営マニュアル等はRMSへログインした状態でご覧下さい)" [ref=e52]:
        - cell "【ご確認ください】 ■R-Loginの「利用者登録」は完了されていますか？ R-Loginの利用者（管理者/スタッフ）の登録が完了していない場合、RMSをご利用いただけません。 責任者様にR-Login利用規約に同意頂いた際、弊社より送らせていただきましたメール（※）に、【管理者/スタッフ登録用URL】を記載しています。 このURLから遷移したR-Login「利用者登録」画面にて、同メールに記載の認証コードを入力し、利用者（管理者/スタッフ）の登録を完了してください。 （※） subject ： 【楽●天】責任者様によるR-Login利用規約同意完了と認証コードの発行のご案内 ■R-Loginの「サービス別権限設定」は正しく設定されていますか？ R-Loginメニュー「利用者管理（権限管理）」の「サービス別権限設定」にて正しく設定がされていない場合、RMSをご利用いただけません。 ▼ 「サービス別権限設定」が正しく設定されている場合 以下のURLよりログインしてください。「お気に入り」や「ブックマーク」に登録することをお奨めします。 RMSログインURL https://mainmenu.rms.rakuten.co.jp/rms ▼ 「サービス別権限設定」が正しく設定されていない場合 R-Loginメニュー「利用者管理（権限管理）」の「サービス別権限設定」にて正しく設定された後に上記URLから再度ログインをお願いいたします。 ■以下の場合は、再度ログインし直していただく必要がございます ▼ブラウザを閉じてしまった場合 ▼ログイン後、長時間作業を行わなかった場合 ▼RMSにログインしていない状態で店舗運営マニュアル等を閲覧した場合 (店舗運営マニュアル等はRMSへログインした状態でご覧下さい)" [ref=e53]:
