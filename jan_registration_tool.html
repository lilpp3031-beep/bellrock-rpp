<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAN一括登録ツール</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231a3c5e'/><text x='16' y='23' font-size='20' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>J</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#f0f4f8;color:#333;font-size:14px}
header{background:#1a3c5e;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
header h1{font-size:20px;font-weight:bold;letter-spacing:1px}
.gs1-badge{background:#ff9900;color:#fff;font-weight:bold;padding:4px 10px;border-radius:4px;font-size:12px;letter-spacing:0.5px}
.version-badge{background:rgba(255,255,255,0.2);color:#fff;padding:3px 8px;border-radius:3px;font-size:11px}
.main-content{max-width:1200px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.1);border:1px solid #e0e8f0;margin-bottom:16px;overflow:hidden}
.card-header{background:#1a3c5e;color:#fff;padding:12px 16px;font-weight:bold;font-size:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.card-header:hover{background:#234d70}
.card-body{padding:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:600;color:#1a3c5e}
.req{color:#e53e3e;margin-left:2px}
input[type=text],input[type=number],select,textarea{border:1px solid #ccd8e4;border-radius:4px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;width:100%;transition:border-color 0.2s}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-color:#1a3c5e;box-shadow:0 0 0 2px rgba(26,60,94,0.12)}
input.error{border-color:#e53e3e;background:#fff5f5}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:all 0.15s}
.btn-primary{background:#1a3c5e;color:#fff}.btn-primary:hover{background:#234d70}
.btn-orange{background:#ff9900;color:#fff}.btn-orange:hover{background:#e68a00}
.btn-danger{background:#e53e3e;color:#fff}.btn-danger:hover{background:#c53030}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-outline{background:#fff;color:#1a3c5e;border:1px solid #1a3c5e}.btn-outline:hover{background:#f0f4f8}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:32px}
.tag{background:#e8f0f8;color:#1a3c5e;border-radius:20px;padding:4px 12px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;border:1px solid #c0d4e8}
.tag.selected{background:#1a3c5e;color:#fff;border-color:#1a3c5e}
.tag .remove{cursor:pointer;color:inherit;opacity:0.6;font-size:14px;line-height:1}.tag .remove:hover{opacity:1}
.jan-display{background:#f0f7ff;border:1px solid #b8d4f0;border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.jan-number{font-size:18px;font-weight:bold;font-family:'Courier New',monospace;color:#1a3c5e;letter-spacing:2px}
.counter-label{font-size:11px;color:#666}
table.variant-table{width:100%;border-collapse:collapse;font-size:13px}
table.variant-table th{background:#1a3c5e;color:#fff;padding:8px 10px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
table.variant-table td{padding:6px 8px;border-bottom:1px solid #e8eef5;vertical-align:middle}
table.variant-table tr:hover td{background:#f8fbff}
table.variant-table td input{border:1px solid #ccd8e4;border-radius:3px;padding:5px 7px;font-size:13px;width:100%;font-family:'Courier New',monospace}
table.variant-table td input.not-mono{font-family:inherit}
.group-card{border:1px solid #d0e0f0;border-radius:8px;margin-bottom:12px;overflow:hidden}
.group-header{background:linear-gradient(135deg,#1a3c5e,#234d70);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.group-title{font-weight:bold;font-size:14px;display:flex;align-items:center;gap:10px}
.variant-badge{background:#ff9900;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px}
.group-body{padding:16px}
.category-detect{background:#fffbf0;border:1px solid #ffd580;border-radius:6px;padding:10px 14px;font-size:12px;margin-top:4px}
.cat-name{font-weight:bold;color:#1a3c5e;font-size:13px}
.cat-codes{color:#666;margin-top:2px}
.sep{height:1px;background:#e8eef5;margin:12px 0}
.action-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0 8px}
.alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:12px}
.alert-warn{background:#fffbf0;border:1px solid #ffd580;color:#7d5200}
.alert-error{background:#fff5f5;border:1px solid #feb2b2;color:#c53030}
.alert-success{background:#f0fff4;border:1px solid #9ae6b4;color:#276749}
.divider{width:1px;height:20px;background:#ccc;margin:0 4px}
.input-addon{display:flex;gap:6px;align-items:center}
.qty-row{display:flex;gap:8px}
.qty-row input[type=number]{flex:0 0 100px}
.qty-row select{flex:0 0 100px}
#log-area{background:#1a1a1a;color:#00ff88;padding:12px;border-radius:6px;font-family:monospace;font-size:12px;max-height:150px;overflow-y:auto;display:none;margin-top:8px}
.text-sm{font-size:12px;color:#666}
.jan-col{font-family:'Courier New',monospace;font-size:13px;letter-spacing:1px;color:#1a3c5e;font-weight:600}
</style>
</head>
<body>
<header>
  <div>
    <h1>JAN一括登録ツール</h1>
    <div style="font-size:11px;opacity:0.8;margin-top:2px">GS1 Japan GJDB 商品登録用テンプレート自動生成</div>
  </div>
  <span class="gs1-badge">GS1 Japan</span>
  <span class="version-badge">v1.0</span>
</header>

<div class="main-content">
  <div id="alert-zone"></div>

  <!-- GS1コード管理 -->
  <div class="card">
    <div class="card-header" onclick="toggleCard(this)">
      <span>GS1コード管理 <span style="opacity:0.7;font-size:12px;font-weight:normal">（LocalStorageに保存されます）</span></span>
      <span id="card-arrow-1" style="display:inline-block;transition:transform 0.2s">&#9660;</span>
    </div>
    <div class="card-body" id="gs1-card-body">
      <div class="grid-2">
        <div>
          <div class="form-group" style="margin-bottom:8px">
            <label>GS1事業者コード（プレフィックス）</label>
            <div class="input-addon">
              <input type="text" id="new-gs1" placeholder="例：4901234" maxlength="9" style="max-width:160px" autocomplete="off">
              <button class="btn btn-primary btn-sm" onclick="addGs1()">+ 追加</button>
            </div>
          </div>
          <div class="tag-list" id="gs1-list"></div>
        </div>
        <div>
          <div class="form-group" style="margin-bottom:8px">
            <label>ブランド名リスト</label>
            <div class="input-addon">
              <input type="text" id="new-brand" placeholder="例：PathBright" style="max-width:160px" autocomplete="new-password">
              <button class="btn btn-primary btn-sm" onclick="addBrand()">+ 追加</button>
            </div>
          </div>
          <div class="tag-list" id="brand-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 商品グループ -->
  <div id="groups-container"></div>

  <!-- アクションバー -->
  <div class="action-bar">
    <button class="btn btn-primary" onclick="addGroup()">+ 商品グループを追加</button>
    <div style="flex:1"></div>
    <button class="btn btn-orange" onclick="downloadXlsx()" style="font-size:14px;padding:10px 20px">
      &#x2B07; XLSXダウンロード（GS1提出用）
    </button>
  </div>
  <div id="log-area"></div>
</div>

function toFullWidth(str) {
  if (!str) return '';
  return str.replace(/[\\x21-\\x7E]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0)).replace(/ /g, '\\u3000');
}

function hiraganaToKatakana(str) {
  return str.replace(/[\\u3041-\\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}

function nameToKana(str) {
  if (!str) return '';
  if (kuromojiTokenizer) {
    try {
      const tokens = kuromojiTokenizer.tokenize(str);
      return tokens.map(t => t.reading || hiraganaToKatakana(t.surface_form)).join('');
    } catch(e) {}
  }
  return hiraganaToKatakana(str);
}

function calcCheck(jan12) {
  let s = 0;
  for (let i = 0; i < 12; i++) s += parseInt(jan12[i]) * (i % 2 === 0 ? 1 : 3);
  return (10 - s % 10) % 10;
}

function generateJan(gs1prefix) {
  const key = 'jan_counter_' + gs1prefix;
  let counter = parseInt(localStorage.getItem(key) || '1');
  const padded = String(counter).padStart(5, '0');
  const jan12 = gs1prefix + padded;
  if (jan12.length !== 12) { log('JANプレフィックス長エラー: ' + gs1prefix); return null; }
  const check = calcCheck(jan12);
  const jan13 = jan12 + check;
  counter++;
  localStorage.setItem(key, counter);
  updateJanDisplay();
  return jan13;
}

function previewNextJan(gs1prefix) {
  if (!gs1prefix) return '—';
  const key = 'jan_counter_' + gs1prefix;
  const counter = parseInt(localStorage.getItem(key) || '1');
  const padded = String(counter).padStart(5, '0');
  const jan12 = gs1prefix + padded;
  if (jan12.length !== 12) return '(プレフィックス長確認)';
  const check = calcCheck(jan12);
  return jan12 + check;
}

function detectCategory(name) {
  if (!name) return null;
  let best = null, bestScore = 0;
  for (const cat of CATEGORY_DB) {
    let score = 0;
    for (const kw of cat.kw) {
      if (name.includes(kw)) score++;
    }
    if (score > bestScore) { bestScore = score; best = cat; }
  }
  return bestScore > 0 ? best : null;
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('span:last-child');
  if (body.style.display === 'none') {
    body.style.display = '';
    if (arrow) arrow.style.transform = '';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.style.transform = 'rotate(-90deg)';
  }
}

}

  if (!selectedGs1) return showAlert('GS1事業者コードを選択してください');
  const key = 'jan_counter_' + selectedGs1;
  const current = localStorage.getItem(key) || '1';
  const val = prompt(selectedGs1 + ' のカウンター値を入力してください（現在: ' + current + '）', current);
  if (val !== null) {
    const n = parseInt(val);
    if (!isNaN(n) && n >= 1) {
      localStorage.setItem(key, n);
      updateJanDisplay();
    } else {
      showAlert('有効な数値を入力してください');
    }
  }

function importJanFromXlsx() {
  document.getElementById('import-xlsx-file').click();
}

function handleImportXlsx(input) {
  if (!input.files[0]) return;
  if (!selectedGs1) return showAlert('GS1事業者コードを選択してください');
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      let maxNum = 0;
      const prefix = selectedGs1;
      for (let r = 3; r < data.length; r++) {
        const gtin = String(data[r][2] || '').replace(/\\D/g,'');
        if (gtin.length === 13 && gtin.startsWith(prefix)) {
          const itemNum = parseInt(gtin.substring(prefix.length, prefix.length + 5));
          if (!isNaN(itemNum) && itemNum > maxNum) maxNum = itemNum;
        }
      }
      if (maxNum > 0) {
        const next = maxNum + 1;
        localStorage.setItem('jan_counter_' + prefix, next);
        updateJanDisplay();
        showAlert('インポート完了。最大JANアイテム番号: ' + maxNum + ' → 次回カウンター: ' + next, 'success');
      } else {
        showAlert('該当するJANが見つかりませんでした。カウンターは変更しません。', 'warn');
      }
    } catch(ex) {
      showAlert('XLSXの読み込みに失敗しました: ' + ex.message, 'error');
    }
  };
  reader.readAsArrayBuffer(input.files[0]);
  input.value = '';
}

    + '<td><input type="text" class="not-mono" id="vdetail-'+ v.id +'" value="'+ detail.replace(/"/g,'&quot;') +'" style="color:#666;font-size:12px" oninput="onVariantChange(\''+ gid +'\',\''+ v.id +'\',\'detail\',this.value)"></td>'
    + '<td><input type="text" class="not-mono" id="vsku-'+ v.id +'" placeholder="例：PB-001-BLK-M" value="'+(v.sku||'')+'" oninput="onVariantChange(\''+ gid +'\',\''+ v.id +'\',\'sku\',this.value)"></td>'
    + '<td style="text-align:center"><button class="btn btn-danger btn-sm" onclick="removeVariant(\''+ gid +'\',\''+ v.id +'\')">&#215;</button></td>';
}

function buildDetail(gid, v) {
  if (v.detailEdited && v.detail) return v.detail;
  const g = groups.find(function(x){ return x.id === gid; });
  if (!g) return '';
  const brand = g.fields.brandCustom || g.fields.brand || '';
  const name = g.name || '';
  const color = v.color || '';
  const size = v.size || '';
  return [brand, name, color, size].filter(Boolean).join(' ');
}

function addVariant(gid) {
  if (!selectedGs1) {
    showAlert('GS1事業者コードを選択してからバリエーションを追加してください');
    return;
  }
  const g = groups.find(function(x){ return x.id === gid; });
  if (!g) return;
  g.variantCounter++;
  const vid = gid + 'v' + g.variantCounter;
  const jan = generateJan(selectedGs1);
  const v = { id: vid, num: g.variantCounter, color:'', size:'', jan: jan||'', sku:'', detail:'', detailEdited: false };
  g.variants.push(v);
  const tbody = document.getElementById('variants-' + gid);
  const tr = document.createElement('tr');
  tr.id = 'vrow-' + vid;
  tr.innerHTML = buildVariantRow(gid, v);
  tbody.appendChild(tr);
  updateVariantCount(gid);
}

function removeVariant(gid, vid) {
  const g = groups.find(function(x){ return x.id === gid; });
  if (!g) return;
  g.variants = g.variants.filter(function(v){ return v.id !== vid; });
  const tr = document.getElementById('vrow-' + vid);
  if (tr) tr.remove();
  updateVariantCount(gid);
}

function removeGroup(gid) {
  if (!confirm('このグループを削除しますか？')) return;
  groups = groups.filter(function(g){ return g.id !== gid; });
  const el = document.getElementById('group-' + gid);
  if (el) el.remove();
}

function toggleGroup(gid) {
  const body = document.getElementById('group-body-' + gid);
  const header = body.previousElementSibling;
  const arrow = header ? header.querySelector('span:last-child') : null;
  if (body.style.display === 'none') {
    body.style.display = '';
    if (arrow) arrow.style.transform = '';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.style.transform = 'rotate(-90deg)';
  }
}

function updateVariantCount(gid) {
  const g = groups.find(function(x){ return x.id === gid; });
  const el = document.getElementById('variant-count-' + gid);
  if (el && g) el.textContent = g.variants.length + 'バリエーション';
}

function updateField(gid, field, value) {
  const g = groups.find(function(x){ return x.id === gid; });
  if (g) g.fields[field] = value;
}

function onBrandChange(gid, sel) {
  const g = groups.find(function(x){ return x.id === gid; });
  if (!g) return;
  const customEl = document.getElementById('brand-custom-' + gid);
  if (sel.value === '__custom__') {
    customEl.style.display = '';
    g.fields.brand = '';
  } else {
    customEl.style.display = 'none';
    g.fields.brand = sel.value;
    g.fields.brandCustom = '';
  }
  updateAllDetails(gid);
}

var nameDebounce = {};
function onNameChange(gid, value) {
  const g = groups.find(function(x){ return x.id === gid; });
  if (!g) return;
  g.name = value;
  const titleEl = document.getElementById('group-title-' + gid);
  if (titleEl) titleEl.textContent = value || '（商品名未入力）';
  updateAllDetails(gid);
  clearTimeout(nameDebounce[gid]);
  nameDebounce[gid] = setTimeout(function() {
    const kanaEl = document.getElementById('kana-' + gid);
    if (kanaEl && !kanaEl.dataset.edited) {
      const kana = nameToKana(value);
      kanaEl.value = kana;
      g.fields.nameKana = kana;
    }
    const cat = detectCategory(value);
    g.fields.category = cat;
    if (cat) {
      const itemEl = document.getElementById('item-' + gid);
      const gpcEl = document.getElementById('gpc-' + gid);
      const jicfsEl = document.getElementById('jicfs-' + gid);
      if (itemEl && !itemEl.value) { itemEl.value = cat.item; g.fields.itemCode = cat.item; }
      if (gpcEl && !gpcEl.value) { gpcEl.value = cat.gpc; g.fields.gpc = cat.gpc; }
      if (jicfsEl && !jicfsEl.value) { jicfsEl.value = cat.jicfs; g.fields.jicfs = cat.jicfs; }
    }
    const body = document.getElementById('group-body-' + gid);
    if (body) {
      const catArea = body.querySelector('.category-detect');
      if (catArea) {
        if (cat) {
          catArea.innerHTML = '<div class="cat-name">' + cat.name
            + ' <span class="gs1-badge" style="font-size:10px;padding:2px 6px">' + cat.seg + '</span></div>'
            + '<div class="cat-codes">取扱品目: ' + cat.item + ' / GPC: ' + cat.gpc + ' / JICFS: ' + cat.jicfs + '</div>';
          catArea.style.color = '';
        } else {
          catArea.innerHTML = '（商品名を入力するとカテゴリを自動検出します）';
          catArea.style.color = '#999';
        }
      }
    }
  }, 300);
}

function onVariantChange(gid, vid, field, value) {
  const g = groups.find(function(x){ return x.id === gid; });
  if (!g) return;
  const v = g.variants.find(function(x){ return x.id === vid; });
  if (!v) return;
  v[field] = value;
  if (field === 'detail') v.detailEdited = true;
  if ((field === 'color' || field === 'size') && !v.detailEdited) {
    const d = buildDetail(gid, v);
    v.detail = d;
    const detailEl = document.getElementById('vdetail-' + vid);
    if (detailEl) detailEl.value = d;
  }
}

function updateAllDetails(gid) {
  const g = groups.find(function(x){ return x.id === gid; });
  if (!g) return;
  g.variants.forEach(function(v) {
    if (!v.detailEdited) {
      const d = buildDetail(gid, v);
      v.detail = d;
      const el = document.getElementById('vdetail-' + v.id);
      if (el) el.value = d;
    }
  });
}

// ================================================================
// EXCEL DOWNLOAD
// ================================================================
function colIndex(headerName) {
  const idx = HEADERS.indexOf(headerName);
  if (idx === -1) throw new Error('Header not found: ' + headerName);
  return idx;
}

function setCell(ws, rowIdx, colIdx, value, type) {
  const addr = XLSX.utils.encode_cell({r: rowIdx, c: colIdx});
  ws[addr] = { t: type, v: value };
}

function downloadXlsx() {
  const errors = [];
  for (let gi = 0; gi < groups.length; gi++) {
    const g = groups[gi];
    if (!g.name.trim()) errors.push('グループ' + g.id + ': 商品名が空です');
    if (!g.fields.brand && !g.fields.brandCustom) errors.push('グループ' + g.id + ': ブランド名が空です');
    if (!g.fields.itemCode) errors.push('グループ' + g.id + ': 取扱品目コードが空です');
    if (!g.fields.gpc) errors.push('グループ' + g.id + ': GPCコードが空です');
    if (!g.fields.qty) errors.push('グループ' + g.id + ': 内容量が空です');
    // バリエーション0件の場合はSKU1として自動追加
    if (g.variants.length === 0) {
      if (!selectedGs1) {
        errors.push('グループ' + g.id + ': GS1事業者コードを選択してください');
      } else {
        g.variantCounter++;
        const vid = g.id + 'v' + g.variantCounter;
        const jan = generateJan(selectedGs1);
        const v = { id: vid, num: g.variantCounter, color:'', size:'', jan: jan||'', sku:'', detail:'', detailEdited: false };
        g.variants.push(v);
        // UIにも反映
        const tbody = document.getElementById('variants-' + g.id);
        if (tbody) {
          const tr = document.createElement('tr');
          tr.id = 'vrow-' + vid;
          tr.innerHTML = buildVariantRow(g.id, v);
          tbody.appendChild(tr);
        }
        updateVariantCount(g.id);
      }
    }
    for (let vi = 0; vi < g.variants.length; vi++) {
      const v = g.variants[vi];
      if (!v.jan || v.jan.length !== 13) errors.push('グループ' + g.id + ' バリエーション' + v.num + ': JANが13桁ではありません（' + v.jan + '）');
    }
  }
  if (errors.length > 0) {
    showAlert('以下のエラーを修正してください:<br>' + errors.map(function(e){ return '・' + e; }).join('<br>'), 'error');
    return;
  }
  if (!selectedGs1) { showAlert('GS1事業者コードを選択してください', 'error'); return; }
  if (groups.length === 0) { showAlert('商品グループが0件です', 'error'); return; }

  try {
    const wb = XLSX.read(TEMPLATE_B64, {type:'base64'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    let rowIdx = 3;

    for (let gi = 0; gi < groups.length; gi++) {
      const g = groups[gi];
      const brand = g.fields.brandCustom || g.fields.brand || '';
      const productName = g.name.trim();

      for (let vi = 0; vi < g.variants.length; vi++) {
        const v = g.variants[vi];
        const color = v.color || '';
        const size = v.size || '';
        const spec = [color, size].filter(Boolean).join(' ');
        const finalName = productName + (spec ? '\\u3000' + spec : '');
        const detailText = v.detailEdited && v.detail ? v.detail : [brand, productName, color, size].filter(Boolean).join(' ');
        const sku = v.sku || '';
        const jan = v.jan;

        function set(headerName, value, type) {
          try { setCell(ws, rowIdx, colIndex(headerName), value, type); } catch(e2) { log('Warning: ' + e2.message); }
        }

        set('GTINステータスコード', '02', 's');
        set('GTIN', jan, 's');
        set('GS1事業者コード', selectedGs1, 's');
        set('商品名', toFullWidth(finalName), 's');
        set('商品名（カナ）', g.fields.nameKana || '', 's');
        if (g.fields.itemCode) set('取扱品目コード', parseInt(g.fields.itemCode), 'n');
        if (g.fields.gpc) set('GPC（GS1商品分類）コード', parseInt(g.fields.gpc), 'n');
        if (g.fields.jicfs) set('JICFS分類コード', parseInt(g.fields.jicfs), 'n');
        set('ブランド名', brand, 's');
        if (g.fields.qty) set('内容量', parseFloat(g.fields.qty), 'n');
        set('内容量単位名称', g.fields.qtyUnit || '個', 's');
        set('内容量単位コード', '001', 's');
        set('表示用規格', toFullWidth(spec), 's');
        set('商品名（詳細）', toFullWidth(detailText), 's');
        set('消費者向け区分', g.fields.consumer || '1', 's');
        if (sku) set('自社商品コード', sku, 's');
        set('オープン価格フラグ', '1', 's');
        set('原産国（地域）コード', g.fields.origin || '156', 's');
        set('販売対象国（地域）コード', '392', 's');
        set('言語コード1', '01', 's');

        rowIdx++;
      }
    }

    ws['!ref'] = 'A1:BQ' + rowIdx;
    const today = new Date();
    const ds = today.getFullYear() + ('0'+(today.getMonth()+1)).slice(-2) + ('0'+today.getDate()).slice(-2);
    XLSX.writeFile(wb, 'gjdb_product_upload_' + ds + '.xlsx');
    showAlert('ダウンロード完了（' + (rowIdx-3) + '件）', 'success');
    log('XLSX生成完了: ' + (rowIdx-3) + '件');
  } catch(ex) {
    showAlert('XLSXの生成に失敗しました: ' + ex.message, 'error');
    log('Error: ' + ex.message);
    console.error(ex);
  }
}

if (selectedGs1 && !gs1List.includes(selectedGs1)) {
  selectedGs1 = gs1List[0] || null;
}
if (!selectedGs1 && gs1List.length > 0) selectedGs1 = gs1List[0];

    e.target.dataset.edited = '1';
  }
});

log('JAN一括登録ツール 起動完了');

// IME対応 Enter キーハンドラ
// Chrome/macOS では compositionend が keydown より先に発火するため justFinished フラグが必要
(function() {
  function bindEnter(inputId, fn) {
    var el = document.getElementById(inputId);
    if (!el) return;
    var composing = false;
    var justFinished = false;
    el.addEventListener('compositionstart', function() {
      composing = true;
      justFinished = false;
    });
    el.addEventListener('compositionend', function() {
      composing = false;
      justFinished = true;
    });
    el.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      if (composing) { return; }          // IME確定中 → 無視
      if (justFinished) {                 // IME確定直後の Enter → 無視して次回を待つ
        justFinished = false;
        return;
      }
      fn();
    });
  }

  bindEnter('new-gs1', addGs1);
  bindEnter('new-brand', addBrand);
}());
